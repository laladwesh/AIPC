    <!-- APPLICATION LOGIC & SESSION API INTEGRATION -->
    <script>
        // Global State
        let companyProfile = null;

        // Dynamic API Base URL Detection (handles file://, localhost, 127.0.0.1, and custom IPs)
        const getApiBaseUrl = () => {
            if (window.API_BASE_URL) return window.API_BASE_URL;
            const host = window.location.hostname;
            const isLocal = !host || host === 'localhost' || host === '127.0.0.1' || window.location.protocol === 'file:';
            return isLocal ? 'http://localhost:5000/api/v1' : '/api/v1';
        };
        const API_BASE_URL = getApiBaseUrl();

        // Helper to format exact joining date with day, month, and year
        function formatExactDate(profile) {
            if (!profile) return 'Recently';
            
            const raw = profile.createdAt || profile.created_at || profile.joinedAt || profile.joined_at || profile.joinedDate || profile.registrationDate;
            if (!raw) return 'Recently';

            const d = new Date(raw);
            if (!isNaN(d.getTime())) {
                return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            return raw; // Fallback if string is non-standard
        }

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            
            const bgColor = type === 'error' ? 'bg-red-800' : type === 'success' ? 'bg-emerald-800' : 'bg-primary';
            const icon = type === 'error' ? 'error' : type === 'success' ? 'check_circle' : 'info';
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm transition-all transform translate-y-2 opacity-0 pointer-events-auto max-w-md`;
            toast.innerHTML = `
                <span class="material-symbols-outlined text-[20px] shrink-0">${icon}</span>
                <span class="flex-1">${message}</span>
                <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white">&times;</button>
            `;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add('opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        const api = {
            // 1. Fetch Session Profile using Cookie credentials
            fetchProfile: async () => {
                let response;
                try {
                    response = await fetch(`${API_BASE_URL}/auth/me`, {
                        method: 'GET',
                        credentials: 'include' // Transmits session HTTP-only cookie
                    });
                } catch (err) {
                    throw new Error('Unable to connect to backend at ' + API_BASE_URL + '. Ensure server is running.');
                }

                if (response.status === 401 || response.status === 403) {
                    // Unauthorized -> Session expired or not logged in
                    window.location.href = 'register.html';
                    return null;
                }

                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.error || result.message || 'Failed to retrieve company profile.');
                }

                return result.company || result.data?.company || result.data || result;
            },

            // 2. Terminate Cookie Session
            logout: async () => {
                try {
                    await fetch(`${API_BASE_URL}/auth/logout`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                } catch (err) {
                    console.log('Logout network error:', err);
                }
                window.location.href = 'register.html';
            }
        };

        // --- Page Initialization ---
        document.addEventListener("DOMContentLoaded", async () => {
            // Step 1: Attempt to fetch data from API
            try {
                companyProfile = await api.fetchProfile();
            } catch (error) {
                console.error('Fetch error:', error);
                showToast(error.message, 'error');
                renderErrorState(error.message);
                return;
            }

            // Step 2: Render UI safely in its own scope
            if (companyProfile) {
                try {
                    renderProfileUI(companyProfile);
                } catch (uiError) {
                    console.error('UI Render Error:', uiError);
                    showToast('Failed to render dashboard interface.', 'error');
                }
            }
        });

        async function handleLogout() {
            showToast('Logging out...', 'info');
            await api.logout();
        }

        // --- Render UI Data ---
        function renderProfileUI(profile) {
            if (!profile) return;

            const companyName = profile.name || profile.companyName || 'Company';
            const email = profile.email || 'N/A';
            const phone = profile.phone || profile.contactNumber || 'N/A';
            const status = profile.status || 'PENDING_APPROVAL';
            
            // Format joined date to include exact day, month, and year
            const joinedDateStr = formatExactDate(profile);

            // Header identity
            const companyNameEl = document.getElementById('company-name');
            const companyJoinedEl = document.getElementById('company-joined');
            const headerCompanyNameEl = document.getElementById('header-company-name');
            const headerUserEmailEl = document.getElementById('header-user-email');

            if (companyNameEl) companyNameEl.innerText = companyName;
            if (companyJoinedEl) companyJoinedEl.innerText = joinedDateStr;
            if (headerCompanyNameEl) headerCompanyNameEl.innerText = companyName;
            if (headerUserEmailEl) headerUserEmailEl.innerText = email;

            // Identity card
            const infoName = document.getElementById('info-company-name');
            const infoEmail = document.getElementById('info-company-email');
            const infoPhone = document.getElementById('info-company-phone');

            if (infoName) infoName.innerText = companyName;
            if (infoEmail) infoEmail.innerText = email;
            if (infoPhone) infoPhone.innerText = phone;

            // Render Status Badge
            const badgeContainer = document.getElementById('status-badge-container');
            if (badgeContainer) {
                if (status === 'APPROVED') {
                    badgeContainer.innerHTML = `
                        <div class="inline-flex items-center gap-1.5 bg-emerald-50 border border-emerald-300 px-3 py-1.5 rounded-lg text-emerald-800 font-semibold text-xs shadow-sm">
                            <span class="material-symbols-outlined text-[16px] text-emerald-600">verified</span>
                            Verified Partner
                        </div>
                        <span class="text-xs text-secondary mt-1 font-medium">Full Recruitment Access</span>
                    `;
                } else if (status === 'REJECTED') {
                    badgeContainer.innerHTML = `
                        <div class="inline-flex items-center gap-1.5 bg-red-50 border border-red-300 px-3 py-1.5 rounded-lg text-red-800 font-semibold text-xs shadow-sm">
                            <span class="material-symbols-outlined text-[16px] text-red-600">cancel</span>
                            Registration Rejected
                        </div>
                        <span class="text-xs text-red-600 mt-1 font-medium">Action Required</span>
                    `;
                } else {
                    // PENDING_APPROVAL
                    badgeContainer.innerHTML = `
                        <div class="inline-flex items-center gap-1.5 bg-amber-50 border border-amber-300 px-3 py-1.5 rounded-lg text-amber-800 font-semibold text-xs shadow-sm">
                            <span class="material-symbols-outlined text-[16px] text-amber-600 animate-pulse">hourglass_empty</span>
                            Verification Pending
                        </div>
                        <span class="text-xs text-secondary mt-1 font-medium">Under Review</span>
                    `;
                }
            }

            // Render Verification Timeline & Actions
            renderTimelineAndActions(status, profile.rejectionReason);
        }

                        <div class="pt-1">
                            <h3 class="text-sm font-semibold text-primary">Institutional Review</h3>
                            <p class="text-xs text-amber-700 font-semibold mt-0.5">In Progress (24-48 hrs)</p>
                        </div>
                    </div>
                `;

                if (footnote) {
                    footnote.innerHTML = `
                        <p class="text-xs text-secondary flex items-start gap-2">
                            <span class="material-symbols-outlined text-[16px] text-primary shrink-0">info</span>
                            <span>Verification typically takes 24-48 business hours. You will receive an automated email as soon as review completes.</span>
                        </p>
                    `;
                }

                if (portalActions) {
                    portalActions.innerHTML = `
                        <div class="p-4 bg-surface-container-low border border-outline-variant rounded-lg flex items-center gap-3">
                            <span class="material-symbols-outlined text-secondary">lock</span>
                            <div>
                                <h4 class="font-semibold text-primary text-sm">Features Locked Pending Verification</h4>
                                <p class="text-secondary text-xs mt-0.5">Job postings, candidate browsing, and interview scheduling will unlock upon TPO approval.</p>
                            </div>
                        </div>
                    `;
                }
            }
        }

        function renderErrorState(message) {
            const badgeContainer = document.getElementById('status-badge-container');
            if (badgeContainer) {
                badgeContainer.innerHTML = `<span class="text-xs text-red-600 font-bold">Offline / Disconnected</span>`;
            }
            const nameEl = document.getElementById('company-name');
            const joinedEl = document.getElementById('company-joined');
            if (nameEl) nameEl.innerText = 'Connection Error';
            if (joinedEl) joinedEl.innerText = 'N/A';
        }
    </script>
</body>
</html>
